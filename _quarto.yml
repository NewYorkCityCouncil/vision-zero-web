project:
  type: website
  output-dir: docs

website:
  search: false
  title: "City Council" 
  favicon: favicon_logo.png
  navbar:
    pinned: true
    background: light
    logo: full-council-logo.png
    title: false
    left:
      - text: "Official VZ Page"
        href: "https://www.nyc.gov/content/visionzero/pages/"
      - text: "VZ Data & Reports"
        href: "https://www.nyc.gov/content/visionzero/pages/open-data"
      - text: "DOT VZ Page"
        href: "https://www.nyc.gov/html/dot/html/motorist/vision-zero-safe-driving.shtml"
      - text: "VZ Map"
        href: "https://vzv.nyc/"
    tools:
      - icon: twitter
        href: https://x.com/NYCCouncilData
      - icon: github
        href: https://github.com/NewYorkCityCouncil/
format:
  html:
    page-layout: full
    grid:
      body-width: 1000px
      margin-width: 150px
    theme: cosmo
    css: styles.css
    toc: false
    include-in-header:
      - text: |
          <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

editor: visual